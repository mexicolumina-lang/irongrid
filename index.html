<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--neon:#00F0FF;--nr:0 240 255;--on:#07070d;--bg:#06060c;--bg2:#0e0e19;--card:#0b0b19d6;--tx:#e9ecff;--mu:#8d92ad;--ln:#ffffff1a;--ink:#00F0FF;--gl:.6;--m:#ff2bd6;--y:#FCEE09;--s1:#16062f;--cf:#0a0a18;--fo:.7;--ov:.9;--nv:rgb(8 8 16/.84);
--f1:'Chakra Petch',system-ui,-apple-system,"Segoe UI",sans-serif;--f2:Orbitron,'Chakra Petch',system-ui,sans-serif;--f3:'Share Tech Mono',ui-monospace,Menlo,monospace}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:500 16px/1.4 var(--f1);min-height:100vh;padding-top:env(safe-area-inset-top);background:none}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--s1),var(--bg) 64%)}
#bg:before{content:"";position:absolute;inset:0;background:radial-gradient(60vmax 40vmax at 88% 6%,rgb(var(--nr)/.24),transparent 62%),radial-gradient(50vmax 36vmax at 2% 62%,rgb(255 43 214/.2),transparent 62%),radial-gradient(70vmax 22vmax at 50% 82%,rgb(255 43 214/.16),transparent 70%)}
#city{position:absolute;left:0;bottom:17vh;width:100%;height:26vh;fill:var(--cf)}#city rect:not(.w){stroke:rgb(var(--nr)/.35);stroke-width:.7}
#city .w{fill:var(--neon);opacity:.9}#city .m{fill:var(--m)}#city .y{fill:var(--y)}
.floor{position:absolute;left:-60%;right:-60%;bottom:-2vh;height:50vh;transform:perspective(380px) rotateX(58deg);transform-origin:50% 100%;background:repeating-linear-gradient(90deg,rgb(var(--nr)/var(--fo)) 0 2px,transparent 2px 56px),repeating-linear-gradient(0deg,rgb(var(--nr)/var(--fo)) 0 2px,transparent 2px 44px);-webkit-mask-image:linear-gradient(to top,#000 4%,transparent 88%);mask-image:linear-gradient(to top,#000 4%,transparent 88%);animation:fl 2.6s linear infinite}
@keyframes fl{to{background-position:0 44px,0 44px}}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;opacity:var(--ov);background:repeating-linear-gradient(0deg,rgb(0 0 0/.17) 0 1px,transparent 1px 3px),radial-gradient(120% 95% at 50% 40%,transparent 55%,rgb(0 0 0/.5))}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#app{position:relative;max-width:760px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
h1,h2,.k{font-family:var(--f2);font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0}
.logo{position:relative;display:inline-block;font-size:clamp(2.3rem,12vw,3.8rem);line-height:1;color:var(--tx);text-shadow:0 0 24px rgb(var(--nr)/var(--gl)),0 0 60px rgb(var(--nr)/.25)}
.glitch:before,.glitch:after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden;text-shadow:none}
.glitch:before{color:var(--m);animation:g1 3.4s infinite steps(1);clip-path:inset(0 0 100% 0)}
.glitch:after{color:#00f0ff;animation:g2 2.9s infinite steps(1);clip-path:inset(100% 0 0 0)}
@keyframes g1{0%,86%,100%{clip-path:inset(0 0 100% 0)}88%{transform:translate(5px,-1px);clip-path:inset(15% 0 45% 0)}90%{clip-path:inset(0 0 100% 0)}93%{transform:translate(-6px,1px);clip-path:inset(55% 0 10% 0)}95%{clip-path:inset(0 0 100% 0)}}
@keyframes g2{0%,80%,100%{clip-path:inset(100% 0 0 0)}83%{transform:translate(-5px,1px);clip-path:inset(30% 0 40% 0)}85%{clip-path:inset(100% 0 0 0)}91%{transform:translate(6px,0);clip-path:inset(5% 0 70% 0)}93%{clip-path:inset(100% 0 0 0)}}
.sub{color:var(--mu);margin:.55rem 0 1.1rem;font-size:.92rem;letter-spacing:.04em}
.sub:after{content:"▮";margin-left:.35rem;color:var(--neon);text-shadow:0 0 8px var(--neon);animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.sec{display:flex;align-items:center;gap:.7rem;margin:1.6rem 0 .8rem;font:800 .82rem var(--f2);letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 12px rgb(var(--nr)/var(--gl))}
.sec:before{content:"";width:11px;height:11px;background:var(--neon);transform:rotate(45deg);box-shadow:0 0 12px var(--neon),0 0 4px var(--m) inset}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--neon),rgb(var(--nr)/.05));box-shadow:0 0 8px var(--neon)}
.card{position:relative;isolation:isolate;margin-bottom:.75rem;padding:.85rem .95rem;border-left:3px solid var(--neon);background:linear-gradient(135deg,rgb(var(--nr)/.07),transparent 40%),var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 28px rgb(var(--nr)/.06);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.card:before{content:"";position:absolute;inset:0;padding:1px;pointer-events:none;background:linear-gradient(135deg,var(--neon),rgb(var(--nr)/.1) 42%,rgb(255 43 214/.65));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom left,transparent calc(50% - 1px),var(--neon) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)) top right/14px 14px no-repeat,linear-gradient(to bottom left,transparent calc(50% - 1px),var(--m) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)) bottom left/14px 14px no-repeat}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.65rem;margin-bottom:.75rem}.grid .card{margin:0}
.l{color:var(--mu);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
.v{font:400 2rem/1.15 var(--f3);color:var(--ink);text-shadow:0 0 16px rgb(var(--nr)/var(--gl)),0 0 2px var(--neon)}
.nm{font:800 .95rem var(--f2);letter-spacing:.07em;text-transform:uppercase}
.tag{font:700 .64rem var(--f1);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--neon);color:var(--ink);background:rgb(var(--nr)/.09);padding:.05rem .45rem;margin-left:.5rem;vertical-align:middle}
.pr{display:inline-block;background:var(--y);color:#111;font:900 .6rem var(--f2);letter-spacing:.12em;padding:.12rem .45rem;margin-left:.5rem;vertical-align:middle;clip-path:polygon(0 0,100% 0,100% 60%,85% 100%,0 100%)}
.chip{display:inline-block;font:400 .85rem var(--f3);padding:.1rem .5rem;margin:.15rem .3rem .15rem 0;border:1px solid rgb(var(--nr)/.35);background:rgb(var(--nr)/.07)}
.beat{position:relative;margin:.7rem 0;padding:.75rem .95rem .75rem 1.3rem;border:1px solid rgb(var(--nr)/.45);background:linear-gradient(90deg,rgb(var(--nr)/.14),rgb(var(--nr)/.03));box-shadow:0 0 22px rgb(var(--nr)/.18),inset 0 0 18px rgb(var(--nr)/.08)}
.beat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:repeating-linear-gradient(-45deg,var(--y) 0 5px,#0a0a0a 5px 10px)}
.beat .k{font-size:.66rem;letter-spacing:.14em;color:var(--ink)}
.beat .big{font:400 clamp(1.5rem,6.5vw,2.2rem) var(--f3);color:var(--ink);text-shadow:0 0 18px rgb(var(--nr)/var(--gl)),0 0 3px var(--neon);margin:.15rem 0 .35rem}
.s{color:var(--mu);font-size:.88rem}
button,input,select{font:inherit;color:var(--tx)}
input,select{width:100%;min-height:44px;padding:.55rem .65rem;border-radius:0;background:rgb(var(--nr)/.05);border:1px solid var(--ln);border-bottom:1px solid rgb(var(--nr)/.65);font-family:var(--f3)}
select{font-family:var(--f1);font-weight:600}select option{background:var(--bg2);color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 20px rgb(var(--nr)/.4),inset 0 0 12px rgb(var(--nr)/.12)}
input[type=checkbox]{width:auto;min-height:0;margin-right:.35rem;accent-color:var(--neon)}input[type=color]{padding:2px;min-height:44px}
button.b{min-height:46px;padding:.7rem .9rem;border:0;cursor:pointer;font:800 .72rem var(--f2);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:rgb(var(--nr)/.05);box-shadow:inset 0 0 0 1px var(--neon),inset 0 0 16px rgb(var(--nr)/.22);text-shadow:0 0 8px rgb(var(--nr)/var(--gl));clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:filter .15s,background .15s}
button.b.p{color:var(--on);text-shadow:none;background:var(--neon);background:linear-gradient(100deg,var(--neon) 35%,var(--m));box-shadow:none}
button.b.w{width:100%}button.b:active{filter:brightness(1.35) saturate(1.2);transform:translateY(1px)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:.55rem 0}.r3{display:grid;grid-template-columns:1fr auto;gap:.5rem;margin:.4rem 0;align-items:center}
.sr{display:grid;grid-template-columns:2rem 1fr 1fr;gap:.5rem;align-items:center;margin:.4rem 0}.sr b{text-align:center;color:var(--m);font:400 1.1rem var(--f3);text-shadow:0 0 10px var(--m)}
.sr input{text-align:center;font:400 1.3rem var(--f3);min-height:50px}
.hd{display:grid;grid-template-columns:2rem 1fr 1fr;gap:.5rem;text-align:center;color:var(--mu);font-size:.64rem;letter-spacing:.2em;margin-top:.6rem}
.row{padding:.55rem 0;border-bottom:1px solid;border-image:linear-gradient(90deg,rgb(var(--nr)/.4),transparent) 1}
.bar{height:9px;margin:.5rem 0;background:rgb(var(--nr)/.12);clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--m));box-shadow:0 0 14px var(--neon)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}.hm i{aspect-ratio:1;display:block;background:var(--ln)}.hm i[style*=background]{box-shadow:0 0 7px rgb(var(--nr)/.7)}
.sw{display:inline-block;width:36px;height:36px;margin:0 .4rem .4rem 0;border:1px solid var(--ln);padding:0;cursor:pointer;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}.sw.on{outline:2px solid var(--tx);outline-offset:2px;clip-path:none}
svg text{fill:var(--mu);font:10px var(--f3)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:grid;grid-template-columns:repeat(5,1fr);background:var(--nv);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding-bottom:env(safe-area-inset-bottom)}
nav:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--neon),var(--m),transparent);box-shadow:0 0 14px var(--neon)}
nav button{background:none;border:0;border-top:3px solid transparent;color:var(--mu);padding:.55rem 0 .5rem;font:700 .6rem var(--f2);letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
nav button span{font-size:1.3rem;line-height:1}
nav button.on{color:var(--ink);border-top-color:var(--neon);background:linear-gradient(180deg,rgb(var(--nr)/.2),transparent);text-shadow:0 0 12px rgb(var(--nr)/var(--gl))}
nav button.on span{filter:drop-shadow(0 0 7px var(--neon))}
#t{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--neon);color:var(--on);font:800 .8rem var(--f2);letter-spacing:.08em;padding:.7rem 1.1rem;z-index:99;display:none;max-width:90vw;box-shadow:0 0 28px var(--neon);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.4rem;box-shadow:0 0 8px currentColor}
</style></head><body>
<div id="bg"><svg id="city" viewBox="0 0 1000 200" preserveAspectRatio="xMidYMax slice"></svg><div class="floor"></div></div>
<div id="t"></div><main id="app"></main><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRE={Cian:'#00F0FF',Magenta:'#FF2BD6','Verde ácido':'#39FF14',Amarillo:'#FCEE09',Naranja:'#FF6B00',Violeta:'#A04DFF',Rojo:'#FF1744',Azul:'#2D6BFF'};
const MU=['Pecho','Espalda','Piernas','Glúteos','Hombros','Bíceps','Tríceps','Core','Cardio','Otro'];
const SEED=[['Press banca','Pecho'],['Press inclinado con mancuernas','Pecho'],['Press militar','Hombros'],['Elevaciones laterales','Hombros'],['Extensión de tríceps en polea','Tríceps'],['Dominadas','Espalda'],['Remo con barra','Espalda'],['Curl de bíceps','Bíceps'],['Sentadilla','Piernas'],['Peso muerto rumano','Piernas'],['Prensa','Piernas']];
const SR={Empuje:[0,1,2,3,4],Tirón:[5,6,7],Pierna:[8,9,10]};
const norm=d=>{const t=d.settings&&d.settings.theme;if(t=='claro')d.settings.theme='light';if(t=='oscuro')d.settings.theme='dark';return d};
const def=()=>({version:1,settings:{theme:'auto',preset:'Cian',custom:'#00F0FF',inc:2.5,unit:'kg'},exercises:[],routines:[],sessions:[],bodyweight:[]});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
let D=(()=>{try{const d=norm(JSON.parse(localStorage.ig_data));d.settings=Object.assign(def().settings,d.settings);return Object.assign(def(),d)}catch(e){return def()}})();
let S=JSON.parse(localStorage.ig_sync||'{}'),tab='home',draft={},day=today(),T={rid:'',extra:[]},pex='',pmet='peso_max',tm=0;
const persistS=()=>localStorage.ig_sync=JSON.stringify(S);
function save(){localStorage.ig_data=JSON.stringify(D);S.dirty=1;persistS();clearTimeout(tm);tm=setTimeout(()=>push().catch(()=>{}),4000)}
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};
// ---- utilidades de entrenamiento
const e1=(w,r)=>w>0&&r>0?w*(1+r/30):0,sc=s=>s.weight>0?e1(s.weight,s.reps):s.reps,ss=s=>s.weight>0?`${+s.weight}×${s.reps}`:`${s.reps} reps`;
const exm=()=>Object.fromEntries(D.exercises.map(e=>[e.id,e])),nm=id=>(exm()[id]||{name:'Ejercicio eliminado'}).name;
const fs=(d,y)=>{const[a,b,c]=d.split('-');return y?`${c}/${b}/${a}`:`${c}/${b}`},vol=s=>s.sets.reduce((a,x)=>a+x.weight*x.reps,0);
const unit=()=>D.settings.unit,chip=t=>`<span class="chip">${E(t)}</span>`,sec=t=>`<div class="sec">${t}</div>`;
function hist(id,before){const m={};[...D.sessions].sort((a,b)=>a.date<b.date?-1:1).forEach(s=>{if(before&&s.date>=before)return;const x=s.sets.filter(t=>t.exercise_id==id);if(x.length)(m[s.date]=m[s.date]||[]).push(...x)});return Object.entries(m).sort((a,b)=>a[0]<b[0]?-1:1)}
const findS=(d,r)=>D.sessions.find(s=>s.date==d&&(s.routine_id||'')==(r||''));
const ids0=r=>r?((D.routines.find(x=>x.id==r)||{}).exercise_ids||[]).filter(i=>exm()[i]):[];
function sug(){if(!D.routines.length)return null;const L={};D.routines.forEach(r=>L[r.id]='');D.sessions.forEach(s=>{if(s.routine_id in L&&s.date>L[s.routine_id])L[s.routine_id]=s.date});return [...D.routines].sort((a,b)=>L[a.id]<L[b.id]?-1:1)[0]}
function loadExtra(){const s=findS(day,T.rid),b=ids0(T.rid);T.extra=s?[...new Set(s.sets.map(x=>x.exercise_id))].filter(i=>exm()[i]&&!b.includes(i)):[]}
function initTrain(){const s=D.sessions.find(s=>s.date==day);T.rid=s?(s.routine_id||''):((sug()||{}).id||'');loadExtra()}
// ---- tema
function theme(){const st=D.settings,dark=st.theme=='dark'||(st.theme=='auto'&&!matchMedia('(prefers-color-scheme:light)').matches),n=st.preset=='Personalizado'?st.custom:PRE[st.preset]||PRE.Cian,rgb=[1,3,5].map(i=>parseInt(n.substr(i,2),16)),L=(.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2])/255,r=document.documentElement.style,set=o=>Object.entries(o).forEach(([k,v])=>r.setProperty('--'+k,v));
set(dark?{bg:'#06060c',bg2:'#0e0e19',card:'#0b0b19d6',tx:'#e9ecff',mu:'#8d92ad',ln:'#ffffff1a',ink:n,gl:.6,s1:'#16062f',cf:'#0a0a18',fo:.7,ov:.9,nv:'rgb(8 8 16/.84)'}:{bg:'#eef0fa',bg2:'#fff',card:'#ffffffdb',tx:'#10121c',mu:'#575d77',ln:'#0a0c1e24',ink:'rgb('+rgb.map(c=>c>>1)+')',gl:.28,s1:'#e4defa',cf:'#c3c7de',fo:.35,ov:.2,nv:'rgb(255 255 255/.88)'});
set({neon:n,nr:rgb.join(' '),on:L>.45?'#07070d':'#fff'});$('meta[name=theme-color]').content=dark?'#06060c':'#f3f4fa'}
matchMedia('(prefers-color-scheme:light)').addEventListener('change',()=>{theme()});
// ---- vistas
function home(){
 if(!D.exercises.length)return `<h1 class="logo glitch" data-t="IRONGRID">IRONGRID</h1><p class="sub">Cada serie queda guardada. Cada marca está para romperse.</p><div class="card"><div class="nm">Empieza aquí</div><p class="s">Crea tus ejercicios y rutinas en Biblioteca, o carga una plantilla de empuje, tirón y pierna.</p><button class="b p w" onclick="seed()">Cargar plantilla</button></div>`;
 const t=today(),wk=iso(new Date(Date.now()-6*864e5)),ws=D.sessions.filter(s=>s.date>=wk),mon=d=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x)};
 const M=new Set(D.sessions.map(s=>mon(s.date)));let c=new Date(mon(t)+'T00:00'),st=0;if(!M.has(iso(c)))c.setDate(c.getDate()-7);while(M.has(iso(c))){st++;c.setDate(c.getDate()-7)}
 const xp=D.sessions.length*60+D.sessions.reduce((a,s)=>a+vol(s),0)/80,lv=Math.floor(Math.sqrt(xp/90))+1,cur=90*(lv-1)**2,nx=90*lv*lv,pct=Math.max(0,Math.min(100,(xp-cur)/(nx-cur)*100));
 const cnt={};D.sessions.forEach(s=>cnt[s.date]=(cnt[s.date]||0)+s.sets.length);const mx=Math.max(8,...Object.values(cnt)),a0=new Date(mon(t)+'T00:00');a0.setDate(a0.getDate()-21*7);let hm='';for(let i=0;i<154;i++){const d=new Date(a0);d.setDate(d.getDate()+i);const k=iso(d),n=cnt[k]||0;hm+=k>t?'<i style="opacity:0"></i>':`<i title="${k}: ${n}" style="${n?`background:var(--neon);opacity:${.3+.7*n/mx}`:''}"></i>`}
 const r=sug(),prs=D.sessions.flatMap(s=>(s.prs||[]).map(p=>[s.date,p,s])).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,5);
 return `<h1 class="logo glitch" data-t="IRONGRID">IRONGRID</h1><p class="sub">Cada serie queda guardada. Cada marca está para romperse.</p>
 <div class="card"><div class="nm">Nivel ${lv}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="s">${Math.round(xp)} / ${Math.round(nx)} xp</div></div>
 <div class="grid"><div class="card"><div class="l">Racha semanal</div><div class="v">${st}</div></div><div class="card"><div class="l">Sesiones, 7 días</div><div class="v">${ws.length}</div></div><div class="card"><div class="l">Volumen, 7 días (${unit()})</div><div class="v">${Math.round(ws.reduce((a,s)=>a+vol(s),0))}</div></div></div>
 ${r?`<div class="card"><div class="l">Te toca</div><div class="nm">${E(r.name)}</div></div>`:''}
 ${sec('Constancia')}<div class="hm">${hm}</div>
 ${sec('Récords recientes')}${prs.map(([d,p,s])=>{const b=s.sets.filter(x=>x.exercise_id==p).sort((a,b)=>sc(b)-sc(a))[0];return `<div class="row"><span class="pr">PR</span> <b>${E(nm(p))}</b> ${chip(ss(b))}<span class="s"> ${fs(d)}</span></div>`}).join('')||'<p class="s">Aún no hay récords.</p>'}

function chart(p,mu){if(!p.length)return '';const W=360,H=190,q=30,xs=p.map(a=>Date.parse(a.d)),x0=Math.min(...xs),rx=(Math.max(...xs)-x0)||1,ys=p.map(a=>a.v),y0=Math.min(...ys),ry=(Math.max(...ys)-y0)||1,X=a=>p.length==1?W/2:q+(Date.parse(a)-x0)/rx*(W-2*q),Y=v=>H-q-(v-y0)/ry*(H-2*q-8);let run=-1,st='';
 p.forEach((a,i)=>{if(a.v>run){if(run>=0)st+=`<path d="M${X(a.d)} ${Y(a.v)-9}l3 6h6l-5 4 2 6-6-4-6 4 2-6-5-4h6z" fill="#ff2bd6" transform="translate(-3 -3)"/>`;run=a.v}});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="var(--neon)" stroke-opacity=".2" stroke-width="10" points="${p.map(a=>X(a.d)+','+Y(a.v)).join(' ')}"/><polyline fill="none" stroke="var(--neon)" stroke-width="3" points="${p.map(a=>X(a.d)+','+Y(a.v)).join(' ')}"/>${p.map(a=>`<circle cx="${X(a.d)}" cy="${Y(a.v)}" r="4" fill="var(--neon)"><title>${fs(a.d,1)}: ${+a.v.toFixed(1)} ${mu}</title></circle>`).join('')}${st}<text x="4" y="${Y(y0)+3}">${+y0.toFixed(1)}</text><text x="4" y="${Y(y0+ry)+3}">${+(y0+ry).toFixed(1)}</text><text x="${q}" y="${H-6}">${fs(p[0].d)}</text><text x="${W-q}" y="${H-6}" text-anchor="end">${fs(p[p.length-1].d)}</text></svg>`}
function prog(){const wh=D.exercises.filter(e=>hist(e.id).length);if(!wh.length)return sec('Progreso')+'<p class="s">Cuando guardes tu primera sesión, aquí verás la evolución de cada ejercicio.</p>'+histv();
 if(!wh.find(e=>e.id==pex))pex=wh[0].id;const h=hist(pex),hw=h.some(x=>x[1].some(s=>s.weight>0)),M=hw?{peso_max:['Peso máximo',unit()],rm:['1RM estimado',unit()],volumen:['Volumen',unit()],reps_max:['Reps máximas','reps'],reps_tot:['Reps totales','reps']}:{reps_max:['Reps máximas','reps'],reps_tot:['Reps totales','reps']};if(!M[pmet])pmet=Object.keys(M)[0];
 const f={peso_max:x=>Math.max(...x.map(s=>s.weight)),rm:x=>Math.max(...x.map(s=>e1(s.weight,s.reps))),volumen:x=>x.reduce((a,s)=>a+s.weight*s.reps,0),reps_max:x=>Math.max(...x.map(s=>s.reps)),reps_tot:x=>x.reduce((a,s)=>a+s.reps,0)}[pmet],pts=h.map(([d,x])=>({d,v:f(x)}));
 let tr='—';if(pts.length>=3){const t=pts.map(a=>(Date.parse(a.d)-Date.parse(pts[0].d))/864e5),n=t.length,mt=t.reduce((a,b)=>a+b)/n,mv=pts.reduce((a,b)=>a+b.v,0)/n,den=t.reduce((a,b)=>a+(b-mt)**2,0);if(den)tr=(t.reduce((a,b,i)=>a+(b-mt)*(pts[i].v-mv),0)/den*30).toFixed(1)+' '+M[pmet][1]+'/mes'}
 const all=h.flatMap(x=>x[1]);
 return `${sec('Progreso')}<select onchange="pex=this.value;render()">${wh.map(e=>`<option value="${e.id}" ${e.id==pex?'selected':''}>${E(e.name)}</option>`).join('')}</select><div style="height:.5rem"></div><select onchange="pmet=this.value;render()">${Object.entries(M).map(([k,v])=>`<option value="${k}" ${k==pmet?'selected':''}>${v[0]}</option>`).join('')}</select>
 <div class="card">${chart(pts,M[pmet][1])}<div class="s">Las estrellas marcan récords.</div></div>
 <div class="grid"><div class="card"><div class="l">${hw?'Mejor peso':'Mejores reps'}</div><div class="v">${hw?Math.max(...all.map(s=>s.weight)):Math.max(...all.map(s=>s.reps))}</div></div><div class="card"><div class="l">Sesiones</div><div class="v">${h.length}</div></div><div class="card"><div class="l">Tendencia</div><div class="v" style="font-size:1.1rem">${tr}</div></div></div>`+histv()}

function lib(){const used=new Set(D.sessions.flatMap(s=>s.sets.map(x=>x.exercise_id)));

function sett(){const s=D.settings,sy=S.repo&&S.token;
 return `${sec('Apariencia')}<select onchange="D.settings.theme=this.value;save();theme();render()">${[['auto','Automático (según tu dispositivo)'],['light','Claro'],['dark','Oscuro']].map(([v,t])=>`<option value="${v}" ${s.theme==v?'selected':''}>${t}</option>`).join('')}</select><div style="height:.6rem"></div>
 ${Object.entries(PRE).map(([n,c])=>`<button class="sw ${s.preset==n?'on':''}" title="${n}" style="background:${c};box-shadow:0 0 10px ${c}" onclick="D.settings.preset='${n}';save();theme();render()"></button>`).join('')}
 <div class="r3" style="grid-template-columns:1fr 1fr 1fr"><input type="color" value="${s.custom}" onchange="D.settings.custom=this.value;D.settings.preset='Personalizado';save();theme();render()"><input type="number" step="0.5" min="0.5" value="${s.inc}" onchange="D.settings.inc=+this.value||2.5;save()" title="Salto de peso"><select onchange="D.settings.unit=this.value;save();render()"><option ${s.unit=='kg'?'selected':''}>kg</option><option ${s.unit=='lb'?'selected':''}>lb</option></select></div>
 <p class="s">Color propio, salto de peso al sugerir una marca y unidad.</p><button class="b w" onclick="resetS()">Restablecer ajustes</button>
 ${sec('Sincronizar con GitHub')}<p class="s"><span class="dot" style="background:${!sy?'#888':S.dirty?'#FCEE09':'#39FF14'}"></span>${!sy?'Sin configurar: los datos viven solo en este teléfono.':S.dirty?'Cambios pendientes de subir.':'Todo respaldado.'}${S.msg?' '+E(S.msg):''}</p>
 <input id="g1" placeholder="repo de datos: usuario/repo" value="${E(S.repo||'')}"><div style="height:.4rem"></div><div class="r2"><input id="g2" placeholder="rama" value="${E(S.branch||'main')}"><input id="g3" placeholder="archivo" value="${E(S.path||'data/gym_pwa.json')}"></div><input id="g4" type="password" placeholder="token de GitHub" value="${E(S.token||'')}">

function seed(){const ids=SEED.map(([n,m])=>{const e={id:uid(),name:n,muscle:m};D.exercises.push(e);return e.id});for(const r in SR)D.routines.push({id:uid(),name:r,exercise_ids:SR[r].map(i=>ids[i])});save();initTrain();render()}

function pending(){return T.rid?(D.routines.find(r=>r.id==T.rid)||{}).name:'Libre'}

 for(const id in per){const pv=D.sessions.filter(x=>x!==s).flatMap(x=>x.sets).filter(x=>x.exercise_id==id).map(sc);s.sets=s.sets.filter(x=>x.exercise_id!=id).concat(per[id]);s.prs=(s.prs||[]).filter(p=>p!=id);if(pv.length&&Math.max(...per[id].map(sc))>Math.max(...pv)+1e-9){s.prs.push(id);m.push('Nuevo récord en '+nm(id))}}

function addEx(){const n=$('#nn').value.trim();if(!n)return toast('Escribe un nombre');if(D.exercises.some(e=>e.name.toLowerCase()==n.toLowerCase()))return toast('Ya existe');D.exercises.push({id:uid(),name:n,muscle:$('#nmu').value});save();render()}
function edEx(id,v){v=v.trim();const e=D.exercises.find(x=>x.id==id);if(v&&!D.exercises.some(x=>x.id!=id&&x.name.toLowerCase()==v.toLowerCase()))e.name=v;else toast('Nombre vacío o repetido');save();render()}

async function push(manual){if(!S.repo||!S.token||!S.dirty||!navigator.onLine)return;let sha,r=await gh('GET');if(r.ok)sha=(await r.json()).sha;else if(r.status!=404)throw r.status;
